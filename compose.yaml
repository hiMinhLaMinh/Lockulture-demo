services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lockulture-backend
    command: ["python", "-m", "src.media.start"]
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENV=development
      - GOOGLE_APPLICATION_CREDENTIALS=/app/service-account.json
    volumes:
      - ./backend/src:/app/src
      - ./backend/service-account.json:/app/service-account.json:ro
      - uploads_data:/app/uploads
    restart: unless-stopped
    # Real provider/job configuration comes from backend/.env, without root-env overrides.

volumes:
  uploads_data:
